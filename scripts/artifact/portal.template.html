<title>Settled Seller Portal</title>
<style>
  @font-face {
    font-family: "EB Garamond";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url(data:font/woff2;base64,__FONT_B64__) format("woff2");
  }

  /* Settled's own palette: parchment ground, deep green, gold.
     Deliberately single-theme — this is the product's light identity. */
  :root {
    --ground-warm: #f6f1e7;
    --ground-pale: #fffaf4;
    --ground-cool: #eef2eb;
    --ink: #16211d;
    --ink-soft: #3a4640;
    --muted: #55635d;
    --muted-deep: #516059;
    --green: #153a35;
    --green-08: rgba(21, 58, 53, 0.08);
    --green-04: rgba(21, 58, 53, 0.04);
    --green-12: rgba(21, 58, 53, 0.12);
    --gold-wash: rgba(219, 179, 94, 0.14);
    --gold-ink: #8b5a20;
    --gold-deep: #5b4c12;
    --surface-high: rgba(255, 255, 255, 0.85);
    --surface: rgba(255, 255, 255, 0.78);
    --surface-low: rgba(255, 255, 255, 0.6);
    --line: rgba(22, 33, 29, 0.08);
    --note-blue: #0d5d81;
    --danger: #8b2e3a;
    --shadow-card: 0 16px 50px rgba(36, 39, 33, 0.08);
    --display: "EB Garamond", "Iowan Old Style", Palatino, Georgia, serif;
    --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    background:
      radial-gradient(circle at top left, rgba(219, 179, 94, 0.16), transparent 32%),
      radial-gradient(circle at top right, rgba(20, 74, 68, 0.18), transparent 28%),
      linear-gradient(180deg, var(--ground-warm) 0%, var(--ground-pale) 50%, var(--ground-cool) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.5;
    margin: 0;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .container {
    margin: 0 auto;
    max-width: 820px;
    padding: 28px 20px 96px;
  }

  /* ---------- top bar ---------- */
  .topBar {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: space-between;
    padding: 8px 0 28px;
  }
  .brandMark { display: block; height: 62px; width: auto; }
  .topBarProperty { display: grid; flex: 1; min-width: 200px; }
  .topBarProperty strong { font-size: 1.05rem; }
  .topBarProperty span { color: var(--muted); font-size: 0.92rem; }

  .actorTabs { align-items: center; display: flex; flex-wrap: wrap; gap: 8px; }
  .demoChip {
    background: rgba(219, 179, 94, 0.2);
    border-radius: 999px;
    color: var(--gold-ink);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 5px 10px;
    text-transform: uppercase;
  }
  .actorTab {
    background: #ece5d8;
    border: 0;
    border-radius: 999px;
    color: #28322f;
    cursor: pointer;
    font: inherit;
    font-size: 0.88rem;
    padding: 8px 14px;
    transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
  }
  .actorTab[aria-pressed="true"] {
    background: var(--green);
    box-shadow: 0 10px 24px rgba(21, 58, 53, 0.22);
    color: #fff;
    transform: translateY(-1px);
  }

  /* ---------- status hero ---------- */
  .statusHero {
    background: var(--surface-high);
    border: 1px solid var(--line);
    border-radius: 28px;
    border-top: 6px solid var(--green);
    box-shadow: var(--shadow-card);
    padding: 32px;
  }
  .statusNav { align-items: center; display: flex; gap: 12px; justify-content: space-between; }
  .statusNavButton {
    background: transparent;
    border: 0;
    color: var(--green);
    cursor: pointer;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 6px 4px;
  }
  .statusNavButton:disabled { color: #a8b2ac; cursor: not-allowed; }
  .statusStageLabel {
    color: var(--gold-ink);
    font-size: 0.86rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-align: center;
    text-transform: uppercase;
  }
  .progressBar {
    background: rgba(21, 58, 53, 0.1);
    border-radius: 999px;
    height: 8px;
    margin: 12px 0 18px;
    overflow: hidden;
    width: 100%;
  }
  .progressBarFill { border-radius: 999px; height: 100%; transition: width 260ms ease, background 260ms ease; }
  .statusHero h1 {
    font-family: var(--display);
    font-size: clamp(2.2rem, 4vw, 3rem);
    font-weight: 600;
    line-height: 1.05;
    margin: 0 0 12px;
    text-wrap: balance;
  }
  .statusExplainer {
    color: var(--ink-soft);
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0 0 22px;
    max-width: 62ch;
  }
  .actions { display: grid; gap: 12px; }
  .actionButton, .ghostButton {
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    font: inherit;
    padding: 14px 18px;
    text-align: left;
    transition: transform 180ms ease, box-shadow 180ms ease;
  }
  .actionButton { background: var(--green); box-shadow: 0 14px 26px rgba(21, 58, 53, 0.2); color: #fff; }
  .actionButton:hover { transform: translateY(-1px); box-shadow: 0 18px 32px rgba(21, 58, 53, 0.26); }
  .actionButton span { display: block; font-size: 0.9rem; opacity: 0.85; }
  .ghostButton { background: var(--green-08); color: var(--green); cursor: default; }
  .previewNotice {
    align-items: center;
    background: var(--gold-wash);
    border-radius: 16px;
    color: var(--gold-deep);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: space-between;
    padding: 14px 16px;
  }
  .previewReturn {
    background: var(--green);
    border: 0;
    border-radius: 999px;
    color: #fff;
    cursor: pointer;
    flex-shrink: 0;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 8px 14px;
  }

  /* ---------- panels ---------- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow-card);
    margin-top: 20px;
    padding: 24px;
  }
  .panel h2 { font-size: 1.1rem; margin: 0 0 14px; }
  .panelSubtitle { color: var(--muted); font-size: 0.9rem; margin: -6px 0 16px; }
  .subheading { font-size: 0.95rem; margin: 20px 0 12px; }

  .checklist { display: grid; gap: 10px; }
  .checklistItem { align-items: start; display: grid; gap: 12px; grid-template-columns: 20px 1fr; }
  .checklistItem strong { font-weight: 600; }
  .checklistItem p { color: var(--muted-deep); font-size: 0.85rem; margin: 0; }
  .dot { border: 2px solid var(--green); border-radius: 999px; height: 20px; margin-top: 2px; width: 20px; }
  .dotDone { background: var(--green); box-shadow: inset 0 0 0 4px var(--ground-pale); }

  .uploadList { display: grid; gap: 10px; }
  .uploadItem {
    align-items: center;
    background: var(--green-04);
    border: 1px solid rgba(21, 58, 53, 0.1);
    border-radius: 16px;
    display: flex;
    gap: 12px;
    justify-content: space-between;
    padding: 14px 16px;
  }
  .uploadItem > div { display: grid; gap: 4px; }
  .uploadItem strong { display: block; font-size: 0.95rem; font-weight: 600; }
  .uploadDone { color: #23613e; font-size: 0.85rem; }
  .uploadPending { color: var(--gold-ink); font-size: 0.85rem; }
  .uploadButton {
    background: var(--green);
    border-radius: 999px;
    color: #fff;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 8px 14px;
  }
  .tipCallout {
    background: var(--gold-wash);
    border-radius: 16px;
    color: var(--gold-deep);
    margin: 20px 0 0;
    padding: 14px 16px;
  }

  /* ---------- help cards ---------- */
  .helpGrid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .helpCard, .serviceItem {
    background: var(--surface-low);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
  }
  .helpCard { display: flex; flex-direction: column; gap: 8px; }
  .helpCard > strong { font-size: 0.98rem; font-weight: 600; }
  .helpCard p, .serviceItem p { color: var(--muted-deep); margin: 0; }
  .resourceMeta { display: flex; flex-wrap: wrap; gap: 8px; }
  .resourceType, .resourceDuration, .serviceCategory {
    background: var(--green-08);
    border-radius: 999px;
    color: var(--green);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 4px 10px;
    text-transform: uppercase;
  }
  .videoSlot { display: block; }
  #helpVideo {
    background: var(--ink);
    border-radius: 12px;
    display: block;
    max-height: 240px;
    width: 100%;
  }
  .guideLink {
    align-self: flex-start;
    background: var(--green);
    border: 0;
    border-radius: 999px;
    color: #fff;
    cursor: pointer;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 8px 14px;
  }
  .agentNote {
    background: rgba(13, 93, 129, 0.08);
    border-radius: 12px;
    color: var(--note-blue) !important;
    font-size: 0.88rem;
    padding: 10px 12px;
  }

  /* ---------- services & vendors ---------- */
  .serviceList { display: grid; gap: 12px; }
  .serviceTop { align-items: center; display: flex; gap: 10px; justify-content: space-between; margin-bottom: 6px; }
  .serviceTop strong { font-size: 0.98rem; font-weight: 600; }
  .serviceCost { color: var(--gold-ink); display: block; font-size: 0.85rem; font-weight: 700; margin-top: 8px; }
  .vendorList { display: grid; gap: 8px; margin-top: 12px; }
  .vendorItem {
    align-items: center;
    background: var(--green-04);
    border: 1px solid var(--green-08);
    border-radius: 12px;
    color: inherit;
    cursor: pointer;
    display: flex;
    font: inherit;
    gap: 12px;
    justify-content: space-between;
    padding: 10px 14px;
    text-align: left;
    text-decoration: none;
    width: 100%;
    transition: transform 160ms ease, box-shadow 160ms ease;
  }
  .vendorItem:hover { box-shadow: 0 8px 20px var(--green-12); transform: translateY(-1px); }
  .vendorItem strong { display: block; font-size: 0.9rem; font-weight: 600; }
  .vendorItem p { color: var(--muted-deep); font-size: 0.82rem; margin: 0; }
  .vendorAction {
    align-items: flex-end;
    color: var(--green);
    display: grid;
    flex-shrink: 0;
    font-size: 0.8rem;
    font-weight: 700;
    gap: 2px;
    text-align: right;
  }
  .rating { color: var(--gold-ink); font-variant-numeric: tabular-nums; font-weight: 700; }

  /* ---------- disclosures ---------- */
  .stack { display: grid; gap: 12px; margin-top: 20px; }
  .disclosure {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
  }
  .disclosure > summary {
    align-items: center;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    list-style: none;
    padding: 18px 20px;
  }
  .disclosure > summary::-webkit-details-marker { display: none; }
  .disclosure > summary strong { display: block; font-size: 1rem; font-weight: 600; }
  .disclosureSubtitle { color: var(--muted); display: block; font-size: 0.85rem; margin-top: 2px; }
  .disclosureIcon { color: var(--green); font-size: 1.2rem; font-weight: 700; }
  .disclosure[open] .disclosureIcon::before { content: "\2212"; }
  .disclosureIcon::before { content: "+"; }
  .disclosurePanel { border-top: 1px solid var(--line); padding: 18px 20px 20px; }

  .stateRail { display: grid; gap: 14px; }
  .stateCard {
    background: var(--surface-low);
    border-left: 7px solid transparent;
    border-radius: 16px;
    padding: 18px 18px 16px;
    transition: transform 180ms ease;
  }
  .stateCardActive { transform: translateX(8px); }
  .stateHeader { align-items: center; display: flex; gap: 10px; justify-content: space-between; }
  .stateCard strong { font-weight: 600; }
  .stateCard p { color: var(--muted-deep); margin: 0; }
  .badge {
    background: var(--green-08);
    border-radius: 999px;
    flex-shrink: 0;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 7px 10px;
    text-transform: uppercase;
  }
  .timeline { display: grid; gap: 14px; }
  .timelineItem { border-left: 2px solid rgba(21, 58, 53, 0.2); padding-left: 18px; }
  .timelineItem strong { font-weight: 600; }
  .timelineItem p { color: var(--muted-deep); margin: 0; }
  .timelineMeta {
    color: var(--gold-ink);
    display: block;
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .candidates { display: grid; gap: 12px; }
  .candidate {
    background: var(--surface-low);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }
  .candidateTop { align-items: flex-start; display: flex; gap: 12px; justify-content: space-between; }
  .candidate h3 { font-size: 1.05rem; margin: 0 0 4px; }
  .candidate p { color: var(--muted-deep); margin: 0; }
  .taskGroups { display: grid; gap: 6px; }
  .taskGroups .subheading { margin-top: 10px; }

  .footerNote { color: #6b746f; font-size: 0.88rem; margin-top: 22px; text-align: center; }
  .footerNote strong { color: var(--ink); }

  /* ---------- vendor profile view ---------- */
  .backLink {
    background: none;
    border: 0;
    color: var(--green);
    cursor: pointer;
    font: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    padding: 6px 0;
  }
  .vendorHero {
    background: var(--surface-high);
    border: 1px solid var(--line);
    border-radius: 28px;
    border-top: 6px solid var(--green);
    box-shadow: var(--shadow-card);
    margin-top: 12px;
    padding: 32px;
  }
  .vendorEyebrow {
    color: var(--gold-ink);
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .vendorHero h1 {
    font-family: var(--display);
    font-size: clamp(1.9rem, 3.4vw, 2.5rem);
    font-weight: 600;
    line-height: 1.1;
    margin: 8px 0 10px;
    text-wrap: balance;
  }
  .vendorHero > p { color: var(--ink-soft); font-size: 1.02rem; margin: 0 0 16px; max-width: 60ch; }
  .vendorFacts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .fact {
    background: var(--green-04);
    border: 1px solid var(--green-08);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .fact dt {
    color: var(--muted);
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .fact dd { font-size: 0.98rem; font-weight: 600; margin: 4px 0 0; }
  .stubNote {
    background: var(--gold-wash);
    border-radius: 16px;
    color: var(--gold-deep);
    margin-top: 18px;
    padding: 14px 16px;
  }
  .quoteForm { display: grid; gap: 12px; }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 0.85rem; font-weight: 700; }
  .field input, .field textarea {
    background: #fff;
    border: 1px solid rgba(22, 33, 29, 0.15);
    border-radius: 14px;
    color: var(--ink);
    font: inherit;
    padding: 11px 14px;
    width: 100%;
  }
  .field textarea { min-height: 96px; resize: vertical; }
  .submitRow { align-items: center; display: flex; flex-wrap: wrap; gap: 12px; }
  .submitButton {
    background: var(--green);
    border: 0;
    border-radius: 999px;
    box-shadow: 0 12px 24px rgba(21, 58, 53, 0.2);
    color: #fff;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    padding: 12px 20px;
  }
  .formStatus { color: #23613e; font-size: 0.9rem; font-weight: 600; }

  /* ---------- guide preview dialog ---------- */
  dialog.guideDialog {
    background: var(--ground-pale);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 30px 80px rgba(36, 39, 33, 0.3);
    color: var(--ink);
    max-height: min(86vh, 820px);
    max-width: min(640px, calc(100vw - 32px));
    padding: 0;
    width: 100%;
  }
  dialog.guideDialog::backdrop { background: rgba(22, 33, 29, 0.45); }
  .guideDialogHead {
    align-items: center;
    background: var(--green);
    color: #fff;
    display: flex;
    gap: 12px;
    justify-content: space-between;
    padding: 14px 18px;
  }
  .guideDialogHead strong { font-weight: 600; }
  .guideClose {
    background: transparent;
    border: 0;
    color: #fff;
    cursor: pointer;
    font-size: 1.4rem;
    line-height: 1;
    padding: 0 4px;
  }
  .guideBody { display: grid; gap: 16px; overflow-y: auto; padding: 24px; }
  .guideSheet {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    display: grid;
    gap: 14px;
    padding: 26px;
  }
  .guideSheet h3 {
    font-family: var(--display);
    font-size: 1.6rem;
    font-weight: 600;
    line-height: 1.15;
    margin: 0;
  }
  .guideSheet h4 {
    color: var(--gold-ink);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin: 0;
    text-transform: uppercase;
  }
  .guideSheet p { color: var(--muted-deep); margin: 0; }
  .guideSheet ul { color: var(--ink-soft); display: grid; gap: 8px; margin: 0; padding-left: 20px; }
  .guideRule { background: var(--green-12); height: 1px; }
  .guideFoot { color: var(--muted); font-size: 0.85rem; }

  /* ---------- chat ---------- */
  .chatWidget { bottom: 24px; position: fixed; right: 24px; z-index: 40; }
  .chatToggle {
    background: var(--green);
    border: 0;
    border-radius: 999px;
    box-shadow: 0 14px 30px rgba(21, 58, 53, 0.3);
    color: #fff;
    cursor: pointer;
    font: inherit;
    font-size: 0.92rem;
    font-weight: 700;
    padding: 14px 20px;
  }
  .chatPanel[hidden] { display: none; }
  .chatPanel {
    background: var(--ground-pale);
    border: 1px solid rgba(22, 33, 29, 0.1);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(36, 39, 33, 0.24);
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 420px;
    margin-bottom: 14px;
    overflow: hidden;
    width: min(340px, calc(100vw - 48px));
  }
  .chatHeader {
    align-items: center;
    background: var(--green);
    color: #fff;
    display: flex;
    justify-content: space-between;
    padding: 14px 16px;
  }
  .chatClose { background: transparent; border: 0; color: #fff; cursor: pointer; font-size: 1.3rem; line-height: 1; }
  .chatMessages { display: grid; gap: 10px; overflow-y: auto; padding: 16px; align-content: start; }
  .chatMessage { border-radius: 14px; font-size: 0.88rem; line-height: 1.4; max-width: 85%; padding: 10px 12px; }
  .chatMessageAssistant { background: var(--green-08); color: var(--ink); justify-self: start; }
  .chatMessageUser { background: var(--green); color: #fff; justify-self: end; }
  .chatForm { border-top: 1px solid var(--line); display: flex; gap: 8px; padding: 12px; }
  .chatInput {
    background: #fff;
    border: 1px solid rgba(22, 33, 29, 0.15);
    border-radius: 999px;
    color: var(--ink);
    flex: 1;
    font: inherit;
    min-width: 0;
    padding: 10px 14px;
  }
  .chatSend {
    background: var(--green);
    border: 0;
    border-radius: 999px;
    color: #fff;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    padding: 10px 16px;
  }

  @media (max-width: 640px) {
    .topBar { align-items: flex-start; flex-direction: column; }
    .uploadItem { align-items: flex-start; flex-direction: column; }
    .previewNotice { align-items: flex-start; flex-direction: column; }
    .helpGrid { grid-template-columns: 1fr; }
    .statusHero, .vendorHero { padding: 24px 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<div class="container" id="app"></div>

<div class="chatWidget">
  <div class="chatPanel" id="chatPanel" hidden>
    <div class="chatHeader">
      <strong>Settled Assistant</strong>
      <button class="chatClose" id="chatClose" type="button" aria-label="Close chat">&times;</button>
    </div>
    <div class="chatMessages" id="chatMessages"></div>
    <form class="chatForm" id="chatForm">
      <input class="chatInput" id="chatInput" type="text" placeholder="Ask a question..." aria-label="Message" />
      <button class="chatSend" type="submit">Send</button>
    </form>
  </div>
  <button class="chatToggle" id="chatToggle" type="button">Need help? Chat</button>
</div>

<dialog class="guideDialog" id="guideDialog" aria-labelledby="guideDialogTitle">
  <div class="guideDialogHead">
    <strong id="guideDialogTitle">Step guide</strong>
    <button class="guideClose" id="guideClose" type="button" aria-label="Close guide">&times;</button>
  </div>
  <div class="guideBody" id="guideBody"></div>
</dialog>

<script>
  const DATA = __JOURNEY_JSON__;
  const LOGO_SRC = "data:image/png;base64,__LOGO_B64__";
  const VIDEO_SRC = "data:video/mp4;base64,__VIDEO_B64__";

  const { stateMeta, journeyStates, transitionMap, sampleJourney } = DATA;

  const actors = [
    { value: "seller", label: "Seller" },
    { value: "agent", label: "Agent" },
    { value: "coordinator", label: "Concierge" },
  ];

  const timeFmt = new Intl.DateTimeFormat("en-AU", {
    dateStyle: "medium",
    timeStyle: "short",
    timeZone: "Australia/Brisbane",
  });

  const state = {
    route: { name: "portal", vendorId: null },
    actor: "seller",
    currentState: sampleJourney.currentState,
    viewState: sampleJourney.currentState,
    timeline: sampleJourney.timeline.map((entry) => ({ ...entry })),
    done: new Map(sampleJourney.checklist.map((item) => [item.state + ":" + item.title, item.done])),
    documents: new Map(),
    open: {},
    enquirySent: new Set(),
  };

  // One persistent player, moved into each render so playback survives re-renders.
  const videoEl = document.createElement("video");
  videoEl.id = "helpVideo";
  videoEl.controls = true;
  videoEl.preload = "metadata";
  videoEl.src = VIDEO_SRC;

  const app = document.getElementById("app");

  const sentence = (value) => value.charAt(0).toUpperCase() + value.slice(1);

  const esc = (value) =>
    String(value).replace(/[&<>"']/g, (ch) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

  function allVendors() {
    const rows = [];
    journeyStates.forEach((stateKey) => {
      stateMeta[stateKey].associatedServices.forEach((service) => {
        service.vendors.forEach((vendor) => {
          rows.push({ vendor, service, state: stateKey, stageLabel: stateMeta[stateKey].label });
        });
      });
    });
    return rows;
  }

  function findVendor(id) {
    return allVendors().find((row) => row.vendor.id === id) || null;
  }

  function totalTasks() {
    return journeyStates.reduce((sum, key) => sum + stateMeta[key].checklist.length, 0);
  }

  function checklistBlock(stateKey, items) {
    return items
      .map((item) => {
        const done = state.done.get(stateKey + ":" + item.title) === true;
        return `
          <div class="checklistItem">
            <span class="dot ${done ? "dotDone" : ""}"></span>
            <div>
              <strong>${esc(item.title)}</strong>
              <p>${esc(sentence(item.owner))} owned task</p>
            </div>
          </div>`;
      })
      .join("");
  }

  function disclosure(id, title, subtitle, inner) {
    return `
      <details class="disclosure" data-disclosure="${id}" ${state.open[id] ? "open" : ""}>
        <summary>
          <span>
            <strong>${esc(title)}</strong>
            <span class="disclosureSubtitle">${esc(subtitle)}</span>
          </span>
          <span class="disclosureIcon" aria-hidden="true"></span>
        </summary>
        <div class="disclosurePanel">${inner}</div>
      </details>`;
  }

  function renderPortal() {
    const viewIndex = journeyStates.indexOf(state.viewState);
    const meta = stateMeta[state.viewState];
    const total = journeyStates.length;
    const isCurrent = state.viewState === state.currentState;
    const showAgentNotes = state.actor !== "seller";
    const actions = (transitionMap[state.currentState] || []).filter((option) => option.actor === state.actor);

    const actionsBlock = isCurrent
      ? `<div class="actions">${
          actions.length
            ? actions
                .map(
                  (action) => `
                    <button class="actionButton" type="button" data-transition="${action.to}">
                      <strong>${esc(action.label)}</strong>
                      <span>${esc(action.detail)}</span>
                    </button>`,
                )
                .join("")
            : `<button class="ghostButton" type="button" disabled>No actions available for the ${esc(state.actor)} role at this stage.</button>`
        }</div>`
      : `<div class="previewNotice">
           <span>You&rsquo;re previewing the <strong>${esc(meta.label)}</strong> step. Actions and uploads are only available on your current step.</span>
           <button class="previewReturn" type="button" data-return-current>Return to current step</button>
         </div>`;

    const documentsBlock = meta.documentsNeeded.length
      ? `<h3 class="subheading">Documents to upload</h3>
         <div class="uploadList">${meta.documentsNeeded
           .map((doc) => {
             const key = state.viewState + ":" + doc;
             const uploaded = state.documents.get(key);
             const status = uploaded
               ? `<span class="uploadDone">Uploaded: ${esc(uploaded)}</span>`
               : `<span class="uploadPending">Not uploaded yet</span>`;
             const control = isCurrent
               ? `<label class="uploadButton">${uploaded ? "Replace" : "Upload"}
                    <input type="file" accept="application/pdf,image/*" hidden data-upload="${esc(key)}" />
                  </label>`
               : "";
             return `<div class="uploadItem"><div><strong>${esc(doc)}</strong>${status}</div>${control}</div>`;
           })
           .join("")}</div>`
      : "";

    const servicesBlock = meta.associatedServices.length
      ? `<div class="serviceList">${meta.associatedServices
          .map(
            (service) => `
              <div class="serviceItem">
                <div class="serviceTop">
                  <strong>${esc(service.name)}</strong>
                  <span class="serviceCategory">${esc(service.category)}</span>
                </div>
                <p>${esc(service.description)}</p>
                <span class="serviceCost">${esc(service.typicalCost)}</span>
                <div class="vendorList">${service.vendors
                  .map(
                    (vendor) => `
                      <button class="vendorItem" type="button" data-vendor="${esc(vendor.id)}">
                        <span>
                          <strong>${esc(vendor.name)}</strong>
                          <p>${esc(vendor.blurb)}</p>
                        </span>
                        <span class="vendorAction">
                          <span class="rating">${vendor.rating.toFixed(1)}</span>
                          View &amp; enquire &rsaquo;
                        </span>
                      </button>`,
                  )
                  .join("")}</div>
              </div>`,
          )
          .join("")}</div>`
      : `<p class="footerNote">No services for this step.</p>`;

    app.innerHTML = `
      <header class="topBar">
        <img class="brandMark" src="${LOGO_SRC}" alt="Settled — Property Solved" width="140" height="70" />
        <div class="topBarProperty">
          <strong>${esc(sampleJourney.propertyAddress)}</strong>
          <span>${esc(sampleJourney.targetPrice)}</span>
        </div>
        <div class="actorTabs">
          <span class="demoChip">Demo</span>
          ${actors
            .map(
              (item) =>
                `<button class="actorTab" type="button" data-actor="${item.value}" aria-pressed="${state.actor === item.value}">${item.label}</button>`,
            )
            .join("")}
        </div>
      </header>

      <section class="statusHero" style="border-top-color:${meta.accent}">
        <div class="statusNav">
          <button class="statusNavButton" type="button" data-step="-1" ${viewIndex === 0 ? "disabled" : ""}>&lsaquo; Previous step</button>
          <div class="statusStageLabel">Step ${viewIndex + 1} of ${total}</div>
          <button class="statusNavButton" type="button" data-step="1" ${viewIndex === total - 1 ? "disabled" : ""}>Next step &rsaquo;</button>
        </div>
        <div class="progressBar">
          <div class="progressBarFill" style="width:${((viewIndex + 1) / total) * 100}%;background:${meta.accent}"></div>
        </div>
        <h1>${esc(meta.label)}</h1>
        <p class="statusExplainer">${esc(meta.whatHappensNow)}</p>
        ${actionsBlock}
      </section>

      <section class="panel">
        <h2>Checklist for this step</h2>
        ${
          meta.checklist.length
            ? `<div class="checklist">${checklistBlock(state.viewState, meta.checklist)}</div>`
            : `<p class="panelSubtitle">No tasks recorded for this step.</p>`
        }
        ${documentsBlock}
        <p class="tipCallout"><strong>Tip:</strong> ${esc(meta.helpTip)}</p>
      </section>

      <section class="panel">
        <h2>Help for this step</h2>
        <div class="helpGrid">
          <div class="helpCard">
            <div class="resourceMeta">
              <span class="resourceType">Video</span>
              <span class="resourceDuration">${meta.helpVideo.durationMinutes} min</span>
            </div>
            <strong>${esc(meta.helpVideo.title)}</strong>
            <span class="videoSlot" id="videoSlot"></span>
            <p>${esc(meta.helpVideo.description)}</p>
            ${
              showAgentNotes && meta.helpVideo.agentNotes
                ? `<p class="agentNote"><strong>For agents:</strong> ${esc(meta.helpVideo.agentNotes)}</p>`
                : ""
            }
          </div>
          <div class="helpCard">
            <div class="resourceMeta"><span class="resourceType">Guide</span></div>
            <strong>${esc(meta.helpGuide.title)}</strong>
            <p>${esc(meta.helpGuide.description)}</p>
            <button class="guideLink" type="button" data-open-guide>Open guide</button>
            ${
              showAgentNotes && meta.helpGuide.agentNotes
                ? `<p class="agentNote"><strong>For agents:</strong> ${esc(meta.helpGuide.agentNotes)}</p>`
                : ""
            }
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>Services &amp; vendors for this step</h2>
        <p class="panelSubtitle">Agents: offer these when relevant. Sellers: ask your agent which vendor suits you.</p>
        ${servicesBlock}
      </section>

      <section class="stack">
        ${disclosure(
          "map",
          "Full journey map",
          total + " stages",
          `<div class="stateRail">${journeyStates
            .map((key) => {
              const stage = stateMeta[key];
              const active = key === state.currentState;
              return `
                <div class="stateCard ${active ? "stateCardActive" : ""}" style="border-left-color:${stage.accent}">
                  <div class="stateHeader">
                    <strong>${esc(stage.label)}</strong>
                    ${active ? `<span class="badge">Current</span>` : ""}
                  </div>
                  <p>${esc(stage.summary)}</p>
                </div>`;
            })
            .join("")}</div>`,
        )}

        ${disclosure(
          "activity",
          "Activity history",
          state.timeline.length + " events",
          `<div class="timeline">${[...state.timeline]
            .reverse()
            .map(
              (entry) => `
                <div class="timelineItem">
                  <span class="timelineMeta">${esc(timeFmt.format(new Date(entry.at)))} &middot; ${esc(entry.actor)}</span>
                  <strong>${esc(stateMeta[entry.to].label)}</strong>
                  <p>${esc(entry.note)}</p>
                </div>`,
            )
            .join("")}</div>`,
        )}

        ${disclosure(
          "agents",
          "Recommended agents",
          sampleJourney.agentCandidates.length + " candidates",
          `<div class="candidates">${sampleJourney.agentCandidates
            .map(
              (candidate) => `
                <div class="candidate">
                  <div class="candidateTop">
                    <div>
                      <h3>${esc(candidate.name)}</h3>
                      <p>${esc(candidate.suburb)} &middot; ${esc(candidate.specialty)}</p>
                    </div>
                    <span class="rating">${candidate.rating.toFixed(1)}</span>
                  </div>
                </div>`,
            )
            .join("")}</div>`,
        )}

        ${disclosure(
          "tasks",
          "All tasks by step",
          totalTasks() + " total",
          `<div class="taskGroups">${journeyStates
            .map((key) => {
              const items = stateMeta[key].checklist;
              if (!items.length) return "";
              return `<div>
                <h3 class="subheading">${esc(stateMeta[key].label)}</h3>
                <div class="checklist">${checklistBlock(key, items)}</div>
              </div>`;
            })
            .join("")}</div>`,
        )}
      </section>

      <p class="footerNote">
        Viewing as <strong>${esc(state.actor)}</strong> &middot; Step content, videos, guides, checklists and vendors
        are all editable from the admin content editor in the live app.
      </p>`;

    document.getElementById("videoSlot").appendChild(videoEl);
  }

  function renderVendor() {
    const found = findVendor(state.route.vendorId);

    if (!found) {
      app.innerHTML = `<p class="footerNote">That vendor is no longer listed. <button class="backLink" type="button" data-back>Back to your sale plan</button></p>`;
      return;
    }

    const { vendor, service, stageLabel } = found;
    const sent = state.enquirySent.has(vendor.id);

    app.innerHTML = `
      <header class="topBar">
        <img class="brandMark" src="${LOGO_SRC}" alt="Settled — Property Solved" width="140" height="70" />
        <div class="topBarProperty">
          <strong>${esc(sampleJourney.propertyAddress)}</strong>
          <span>${esc(sampleJourney.targetPrice)}</span>
        </div>
        <div class="actorTabs"><span class="demoChip">Demo</span></div>
      </header>

      <button class="backLink" type="button" data-back>&lsaquo; Back to your sale plan</button>

      <section class="vendorHero">
        <span class="vendorEyebrow">${esc(service.category)} &middot; ${esc(stageLabel)}</span>
        <h1>${esc(vendor.name)}</h1>
        <p>${esc(vendor.blurb)}</p>
        <dl class="vendorFacts">
          <div class="fact"><dt>Rating</dt><dd class="rating">${vendor.rating.toFixed(1)} / 5.0</dd></div>
          <div class="fact"><dt>Service</dt><dd>${esc(service.name)}</dd></div>
          <div class="fact"><dt>Typical cost</dt><dd>${esc(service.typicalCost)}</dd></div>
        </dl>
        <p class="stubNote">
          Full vendor profiles &mdash; coverage areas, availability and live pricing &mdash; arrive with the
          Settled partner network. For now, send an enquiry and your agent will coordinate the quote.
        </p>
      </section>

      <section class="panel">
        <h2>What this covers</h2>
        <p class="panelSubtitle">Part of <strong>${esc(service.name)}</strong> at the ${esc(stageLabel)} step.</p>
        <p>${esc(service.description)}</p>
      </section>

      <section class="panel">
        <h2>Request a quote</h2>
        <p class="panelSubtitle">Goes to your agent, who briefs ${esc(vendor.name)} on your property.</p>
        <form class="quoteForm" id="quoteForm">
          <div class="field">
            <label for="quoteName">Your name</label>
            <input id="quoteName" name="name" type="text" value="${esc(sampleJourney.sellerName)}" required />
          </div>
          <div class="field">
            <label for="quoteContact">Email or phone</label>
            <input id="quoteContact" name="contact" type="text" placeholder="0412 345 678" required />
          </div>
          <div class="field">
            <label for="quoteNotes">What do you need?</label>
            <textarea id="quoteNotes" name="notes" placeholder="Tell ${esc(vendor.name)} about the property and your timing."></textarea>
          </div>
          <div class="submitRow">
            <button class="submitButton" type="submit">Send enquiry</button>
            <span class="formStatus" id="quoteStatus">${
              sent ? "Enquiry noted &mdash; your agent will be in touch." : ""
            }</span>
          </div>
        </form>
      </section>

      <p class="footerNote">
        Vendor pages are stubs in this preview. In production they pull partners who service the seller&rsquo;s suburb.
      </p>`;
  }

  function render(scrollToTop) {
    if (state.route.name === "vendor") {
      renderVendor();
    } else {
      renderPortal();
    }
    if (scrollToTop) window.scrollTo(0, 0);
  }

  /* ---------- guide preview ---------- */
  const guideDialog = document.getElementById("guideDialog");
  const guideBody = document.getElementById("guideBody");

  function openGuide() {
    const meta = stateMeta[state.viewState];
    const index = journeyStates.indexOf(state.viewState) + 1;
    const showAgentNotes = state.actor !== "seller";

    document.getElementById("guideDialogTitle").textContent = meta.helpGuide.title;
    guideBody.innerHTML = `
      <div class="guideSheet">
        <h4>Settled &middot; Step ${index} of ${journeyStates.length} &middot; ${esc(meta.label)}</h4>
        <h3>${esc(meta.helpGuide.title)}</h3>
        <p>${esc(meta.helpGuide.description)}</p>
        <div class="guideRule"></div>
        <h4>What to complete</h4>
        <ul>${meta.checklist.map((item) => `<li>${esc(item.title)} &mdash; ${esc(item.owner)}</li>`).join("")}</ul>
        ${
          meta.documentsNeeded.length
            ? `<h4>Documents to have ready</h4><ul>${meta.documentsNeeded
                .map((doc) => `<li>${esc(doc)}</li>`)
                .join("")}</ul>`
            : ""
        }
        <div class="guideRule"></div>
        <h4>Good to know</h4>
        <p>${esc(meta.helpTip)}</p>
        ${
          showAgentNotes && meta.helpGuide.agentNotes
            ? `<p class="agentNote"><strong>For agents:</strong> ${esc(meta.helpGuide.agentNotes)}</p>`
            : ""
        }
      </div>
      <p class="guideFoot">
        Preview of the guide content for this step. The live app serves the uploaded PDF, which agents replace
        per step from the content editor.
      </p>`;

    guideDialog.showModal();
  }

  document.getElementById("guideClose").addEventListener("click", () => guideDialog.close());

  /* ---------- interactions ---------- */
  app.addEventListener("click", (event) => {
    const target = event.target;

    const stepButton = target.closest("[data-step]");
    if (stepButton) {
      const next = journeyStates.indexOf(state.viewState) + Number(stepButton.dataset.step);
      if (next >= 0 && next < journeyStates.length) {
        state.viewState = journeyStates[next];
        render(true);
      }
      return;
    }

    const actorButton = target.closest("[data-actor]");
    if (actorButton) {
      state.actor = actorButton.dataset.actor;
      render();
      return;
    }

    const transitionButton = target.closest("[data-transition]");
    if (transitionButton) {
      const to = transitionButton.dataset.transition;
      const option = (transitionMap[state.currentState] || []).find(
        (candidate) => candidate.to === to && candidate.actor === state.actor,
      );
      if (!option) return;

      const movingForward = journeyStates.indexOf(to) > journeyStates.indexOf(state.currentState);

      state.timeline.push({
        at: new Date().toISOString(),
        actor: state.actor,
        from: state.currentState,
        to,
        note: state.actor + " advanced the property to " + stateMeta[to].label + ".",
      });
      // Leaving a step for a later one settles its tasks; stepping back reopens them.
      stateMeta[state.currentState].checklist.forEach((item) => {
        state.done.set(state.currentState + ":" + item.title, movingForward);
      });
      state.currentState = to;
      state.viewState = to;
      render(true);
      return;
    }

    if (target.closest("[data-return-current]")) {
      state.viewState = state.currentState;
      render(true);
      return;
    }

    if (target.closest("[data-open-guide]")) {
      openGuide();
      return;
    }

    const vendorButton = target.closest("[data-vendor]");
    if (vendorButton) {
      state.route = { name: "vendor", vendorId: vendorButton.dataset.vendor };
      render(true);
      return;
    }

    if (target.closest("[data-back]")) {
      state.route = { name: "portal", vendorId: null };
      render(true);
    }
  });

  app.addEventListener("change", (event) => {
    const input = event.target.closest("[data-upload]");
    if (!input || !input.files || !input.files[0]) return;
    state.documents.set(input.dataset.upload, input.files[0].name);
    render();
  });

  app.addEventListener("toggle", (event) => {
    const details = event.target.closest("[data-disclosure]");
    if (details) state.open[details.dataset.disclosure] = details.open;
  }, true);

  app.addEventListener("submit", (event) => {
    if (event.target.id !== "quoteForm") return;
    event.preventDefault();
    state.enquirySent.add(state.route.vendorId);
    document.getElementById("quoteStatus").textContent = "Enquiry noted — your agent will be in touch.";
  });

  /* ---------- chat ---------- */
  const chatPanel = document.getElementById("chatPanel");
  const chatToggle = document.getElementById("chatToggle");
  const chatMessages = document.getElementById("chatMessages");

  const chat = [
    {
      from: "assistant",
      text: "Hi, I'm the Settled Assistant. I'm always here if the video or guide for your step doesn't answer your question. Full AI-powered answers are coming soon.",
    },
  ];

  function renderChat() {
    chatMessages.innerHTML = chat
      .map(
        (message) =>
          `<div class="chatMessage ${
            message.from === "user" ? "chatMessageUser" : "chatMessageAssistant"
          }">${esc(message.text)}</div>`,
      )
      .join("");
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  chatToggle.addEventListener("click", () => {
    const open = chatPanel.hasAttribute("hidden");
    if (open) {
      chatPanel.removeAttribute("hidden");
      chatToggle.textContent = "Close chat";
    } else {
      chatPanel.setAttribute("hidden", "");
      chatToggle.textContent = "Need help? Chat";
    }
  });

  document.getElementById("chatClose").addEventListener("click", () => {
    chatPanel.setAttribute("hidden", "");
    chatToggle.textContent = "Need help? Chat";
  });

  document.getElementById("chatForm").addEventListener("submit", (event) => {
    event.preventDefault();
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text) return;
    chat.push({ from: "user", text });
    chat.push({
      from: "assistant",
      text: "Thanks for the message! Live AI answers aren't wired up yet — in the meantime, check the video and guide for this step or ask your agent directly.",
    });
    input.value = "";
    renderChat();
  });

  renderChat();
  render();
</script>
